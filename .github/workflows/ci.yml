# The checks every ticket has been run by hand until now, run for real on the PR.
#
# Deliberately one job: the steps are seconds each, they share an install, and
# three parallel jobs would spend more time restoring node_modules than checking
# anything. Split it when the suite gets slow enough to be worth the ceremony.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Stands in for Neon, exactly as docker-compose.yml's `db` does locally. The
    # site's build reads the record over HTTP, so a check that builds the site
    # has to have a CMS to read from, and a CMS has to have a database.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hkucc
          POSTGRES_PASSWORD: hkucc
          POSTGRES_DB: hkucc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hkucc -d hkucc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      # Matched to the runtime Vercel builds on, so the check that gates a merge
      # runs what production will run. Bump both together, never one.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # The root install covers every workspace; npm ci fails loudly if the
      # lockfile and the manifests disagree, which is the point of using it here.
      - run: npm ci

      # tokens.css is generated and must never be hand-edited (CLAUDE.md). This
      # regenerates it and fails if the committed file differs, so a hand-edited
      # palette cannot reach main. derive.js additionally refuses to emit CSS at
      # all if any colour pair falls under WCAG AA, so this checks contrast too.
      # --strip-trailing-cr: the file is committed with LF, and a Windows
      # contributor's checkout may hand it back with CRLF.
      - name: tokens.css matches design/derive.js
        run: node design/derive.js --css | diff --strip-trailing-cr - apps/web/src/app/tokens.css

      - run: npm run lint

      - run: npm run typecheck

      # The suite pins TZ to a zone behind UTC (apps/web/vitest.config.ts). This
      # runner is UTC, where a date-only value formatted in local time looks
      # correct right up until a reader west of Greenwich loads the page.
      - run: npm test

      # The CMS is built before the site, not after, because the site's build
      # reads the record out of it. It has no equivalent gate of its own —
      # Render builds the image and only finds out on deploy — so a broken
      # Payload config fails the pull request here instead.
      - run: npm run build:cms

      # A real CMS, briefly, rather than a fixture.
      #
      # The site's build is a client of Payload's REST API, and the thing most
      # worth catching is the two disagreeing: a renamed field, a changed depth,
      # a query that returns something other than what ./lib/record expects. A
      # committed fixture would be the site's own idea of the CMS's answers,
      # which cannot catch that by construction — it drifts in exactly the same
      # commit that breaks production.
      #
      # The record is empty, and that is not a gap: every component that reads
      # it collapses to nothing when it has nothing, so an empty CMS proves the
      # page still renders between seasons. What the shapes *mean* is covered by
      # the unit tests above, which is the cheaper place for it.
      #
      # Run from the standalone bundle, the same artefact Render runs, with
      # NODE_ENV=production — which is what makes Payload apply `prodMigrations`
      # as it initialises rather than pushing the schema. The migrations
      # committed with a collection change are therefore exercised on every PR,
      # and a collection changed without one fails here.
      - name: Start the CMS
        env:
          DATABASE_URL: postgres://hkucc:hkucc@localhost:5432/hkucc
          # Local, disposable, and 64 characters because src/lib/env.ts insists.
          PAYLOAD_SECRET: continuous-integration-only-not-a-secret-00000000000000000000000
          PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3001
          # Nothing uploads during a build, so these are never dialled — they
          # exist because the CMS refuses to start with a hole in its
          # environment, which is the behaviour we want and not one to weaken
          # for CI's convenience.
          R2_BUCKET: hkucc-media
          R2_ENDPOINT: http://localhost:9000
          R2_PUBLIC_URL: http://localhost:9000/hkucc-media
          R2_ACCESS_KEY_ID: continuous-integration
          R2_SECRET_ACCESS_KEY: continuous-integration
          # SITE_REVALIDATE_URL and REVALIDATE_SECRET are deliberately unset.
          # Both or neither, and there is no site here to announce a publish to.
          PORT: 3001
          HOSTNAME: 127.0.0.1
          NODE_ENV: production
        run: |
          # Its output goes to a file rather than this step's log: the step ends
          # as soon as the process is backgrounded, and anything written after
          # that would be written to a log nobody is reading. The wait below
          # prints it if the CMS never comes up, which is the only time it is
          # wanted.
          node apps/cms/.next/standalone/apps/cms/server.js > /tmp/cms.log 2>&1 &
          echo "CMS_PID=$!" >> "$GITHUB_ENV"

      # /health reaches past "the port is open" and into Postgres, so this waits
      # for the answer the site's build actually needs. Sixty seconds: Payload
      # initialising and applying migrations is several seconds, and a runner
      # under load is slower than a laptop.
      - name: Wait for the CMS
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health > /dev/null; then
              echo "CMS answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "The CMS never became healthy in 60s. Its own output:"
          cat /tmp/cms.log
          exit 1

      - run: npm run build
        env:
          CMS_URL: http://localhost:3001

      # Reads the manifests the build just wrote. Why the site has to be static,
      # and what to do if this fires, is in docs/deploy.md.
      - name: Every route is prerendered
        run: npm run assert:prerendered

      # Always, so a failed build still leaves the runner tidy rather than
      # holding the port for whatever the job does next.
      - name: Stop the CMS
        if: always()
        run: kill "$CMS_PID" 2>/dev/null || true
